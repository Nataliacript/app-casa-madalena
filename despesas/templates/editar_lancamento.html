<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Despesa</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        div {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-salvar {
            width: 100%;
            padding: 12px;
            background-color: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-voltar {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>✏️ Editar Lançamento</h1>
        <div style="text-align: right; margin-bottom: 20px;">
            <a href="{% url 'logout' %}"
                style="color: red; text-decoration: none; font-weight: bold; font-size: 14px;">🔒 Sair do Sistema</a>
        </div>

        <form method="POST" action="">
            {% csrf_token %}

            <div>
                <label>Date:</label>
                <input type="date" name="data" value="{{ despesa.data|date:'Y-m-d' }}" required>
            </div>

            <div>
                <label>Value ($):</label>
                <input type="number" step="0.01" name="valor" value="{{ despesa.valor }}" required>
            </div>

            <!-- NOVA LÓGICA: Sem if's no select. O JavaScript vai arrumar! -->
            <div>
                <label>Money from:</label>
                <select name="origem" id="id_origem_edit" required>
                    <option value="Money Box">Money Box</option>
                    <option value="BPI">BPI</option>
                    <option value="Revolut">Revolut</option>
                    <option value="Drop">Drop</option>
                    <option value="Adrien Money">Adrien Money</option>

                </select>
            </div>

            <div>
                <label>Category:</label>
                <select id="id_categoria" name="categoria" required>
                    <option value="Annualidad-Fixa">Annualidad-Fixa</option>
                    <option value="Bar">Bar</option>
                    <option value="Bed Bugs">Bed Bugs</option>
                    <option value="Bpi">Bpi</option>
                    <option value="Café da manhã">Café da manhã</option>
                    <option value="Chill Pills">Chill Pills</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Despesas Pessoais">Despesas Pessoais</option>
                    <option value="Drop">Drop</option>
                    <option value="Hostel furnitures">Hostel furnitires</option>
                    <option value="Impostos">Impostos</option>
                    <option value="Insurance">Insurance</option>
                    <option value="Liquor Bar">Liquor Bar</option>
                    <option value="Lollipop">Lollipop</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Mensalidade-Fixa">Mensalidade-fixa</option>
                    <option value="Obra-Cafe">Obra-Cafe</option>
                    <option value="Others">Others</option>
                    <option value="Papelaria">Papelaria</option>
                    <option value="Papel Pack">Papel Pack</option>
                    <option value="Refund">Refund</option>
                    <option value="The Project 50">The Project 50</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Wages">Wages</option>
                </select>
            </div>

            <div>
                <label>Subcategory:</label>
                <select id="id_subcategoria" name="subcategoria" required>
                </select>
            </div>

            <div>
                <label>Number:</label>
                <input type="text" name="numero" value="{{ despesa.numero }}">
            </div>



            <div>
                <label>Reference Month/Year:</label>
                <input type="text" name="info" value="{{ despesa.info }}" placeholder="MM/AAAA (Ex: 02/2026)"
                    pattern="^(0[1-9]|1[0-2])\/\d{4}$" title="Por favor, use o formato MM/AAAA. Exemplo: 02/2026"
                    required>
            </div>


            <div>
                <label>Description/ Supplier/ Employee:</label>
                <textarea name="descricao" rows="4" required>{{ despesa.descricao }}</textarea>
            </div>

            <a href="{% url 'home' %}"
                style="display: block; text-align: center; text-decoration: none; color: #666; margin-top: 10px;">←
                Back to the list</a>
            <!-- Container para colocar os botões um do lado do outro -->
            <div style="display: flex; gap: 10px; margin-top: 20px;">

                <!-- BOTÃO 1: Salva e volta para a lista (Original) -->
                <button type="submit" name="acao" value="salvar_voltar"
                    style="flex: 1; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;">
                    Salve and Back to the list
                </button>


                </button>


            </div>


        </form>

            // 3. Função para preencher a subcategoria
            function preencherSubcategorias(categoria, subcatParaSelecionar) {
                selectSubcategoria.innerHTML = '';
                if (subcategoriasPorCategoria[categoria]) {
                    subcategoriasPorCategoria[categoria].forEach(function (sub) {
                        let option = document.createElement('option');
                        option.value = sub;
                        option.textContent = sub;
                        if (sub === subcatParaSelecionar) option.selected = true;
                        selectSubcategoria.appendChild(option);
                    });
                }
            }

            // 4. Força a seleção da Categoria salva e preenche as subs
            selectCategoria.value = categoriaSalva;
            preencherSubcategorias(categoriaSalva, subcategoriaSalva);

            // 5. Se o usuário mudar a categoria, atualiza a subcategoria
            selectCategoria.addEventListener('change', function () {
                preencherSubcategorias(this.value, '');
            });

</html>
