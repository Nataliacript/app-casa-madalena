<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Despesa</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        div {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-salvar {
            width: 100%;
            padding: 12px;
            background-color: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-voltar {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>✏️ Editar Lançamento</h1>

        <form method="POST" action="">
            {% csrf_token %}

            <div>
                <label>Data:</label>
                <input type="date" name="data" value="{{ despesa.data|date:'Y-m-d' }}" required>
            </div>

            <div>
                <label>Valor (R$):</label>
                <input type="number" step="0.01" name="valor" value="{{ despesa.valor }}" required>
            </div>

            <!-- NOVA LÓGICA: Sem if's no select. O JavaScript vai arrumar! -->
            <div>
                <label>Origem:</label>
                <select name="origem" id="id_origem_edit" required>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="PIX">PIX</option>
                    <option value="Transferência">Transferência</option>
                </select>
            </div>

            <div>
                <label>Categoria:</label>
                <select id="id_categoria" name="categoria" required>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Educação">Educação</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div>
                <label>Subcategoria:</label>
                <select id="id_subcategoria" name="subcategoria" required>
                </select>
            </div>

            <div>
                <label>Número:</label>
                <input type="text" name="numero" value="{{ despesa.numero }}" required>
            </div>

            <div>
                <label>Info Extras:</label>
                <input type="text" name="info" value="{{ despesa.info }}" required>
            </div>

            <div>
                <label>Descrição:</label>
                <textarea name="descricao" rows="4" required>{{ despesa.descricao }}</textarea>
            </div>

            <button type="submit" class="btn-salvar">Salvar Alterações</button>
            <a href="{% url 'home' %}" class="btn-voltar">← Cancelar e Voltar para a lista</a>
        </form>
    </div>

        // 3. Função para preencher a subcategoria
        function preencherSubcategorias(categoria, subcatParaSelecionar) {
            selectSubcategoria.innerHTML = '';
            if (subcategoriasPorCategoria[categoria]) {
                subcategoriasPorCategoria[categoria].forEach(function (sub) {
                    let option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    if (sub === subcatParaSelecionar) option.selected = true;
                    selectSubcategoria.appendChild(option);
                });
            }
        }

        // 4. Força a seleção da Categoria salva e preenche as subs
        selectCategoria.value = categoriaSalva;
        preencherSubcategorias(categoriaSalva, subcategoriaSalva);

        // 5. Se o usuário mudar a categoria, atualiza a subcategoria
        selectCategoria.addEventListener('change', function () {
            preencherSubcategorias(this.value, '');
        });
