<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Novo Hóspede</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #6f42c1;
        }

        div {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-salvar {
            width: 100%;
            padding: 12px;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-voltar {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #666;
            margin-top: 15px;
        }

        .config-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .total-box {
            background: #d4edda;
            padding: 10px;
            font-weight: bold;
            color: green;
            font-size: 18px;
            text-align: right;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="{% url 'listar_family' %}" class="btn-voltar">← Voltar</a>
        <h1>👨‍👩‍👧‍👦 Novo Hóspede</h1>

        <div class="config-box">
            <h3>⚙️ Configurar Métodos de Pagamento (Excel)</h3>
            <form method="POST" action="{% url 'upload_config_extras' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <!-- NOVA LINHA: Avisa o Python que estamos na tela de Family -->
                <input type="hidden" name="tela_origem" value="family">

                <input type="file" name="arquivo_origens" accept=".xlsx" style="padding: 5px; font-size: 12px;">
                <button type="submit"
                    style="width: 100%; margin-top: 10px; background: #6c757d; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer;">Atualizar
                    Lista</button>
            </form>
        </div>

        <form method="POST" action="{% url 'criar_family' %}">
            {% csrf_token %}
            <div><label>Name:</label> <input type="text" name="name" required></div>

            <div><label>Bed Number (1 a 24):</label>
                <input type="number" name="bed_number" min="1" max="24" required>
            </div>

            <div><label>Payment Date (dd/mm/aaaa):</label>
                <input type="text" name="payment_date" placeholder="01/08/2026"
                    pattern="^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/\d{4}$" title="Formato: dd/mm/aaaa" required>
            </div>

            <div class="grid-3">
                <div><label>Check in:</label> <input type="text" name="check_in" placeholder="01/08/2026"
                        pattern="^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/\d{4}$" title="dd/mm/aaaa" required
                        onchange="calcularNoites()"></div>
                <div><label>Check out:</label> <input type="text" name="check_out" placeholder="05/08/2026"
                        pattern="^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/\d{4}$" title="dd/mm/aaaa" required
                        onchange="calcularNoites()"></div>
                <div><label>Adults (1 a 24):</label> <input type="number" name="adults" min="1" max="24" required
                        oninput="calcularTotal()"></div>
            </div>

            <div class="grid-3">
                <div><label>Amount per Night ($):</label> <input type="number" step="0.01" name="amount_per_night"
                        required oninput="calcularTotal()"></div>
                <div><label>Nights (1 a 30):</label> <input type="number" name="nights" min="1" max="30" required
                        oninput="calcularTotal()"></div>
                <div class="total-box">Total:<br> $ <span id="id_total">0.00</span></div>
            </div>

            <div>
                <label>Payment Method:</label>
                <select id="id_origin" name="payment_method" required>
                    <option value="" disabled selected>Selecione...</option>
                </select>
            </div>

            <button type="submit" class="btn-salvar">Salvar Hóspede</button>
        </form>
    </div>

    <script>
        const origensDoExcel = {{ origens_json| safe }};
        const selectOrigin = document.getElementById('id_origin');

        // 1. Preenche o select de formas de pagamento
        origensDoExcel.forEach(origem => {
            let option = document.createElement('option');
            option.value = origem;
            option.textContent = origem;
            selectOrigin.appendChild(option);
        });

        // 2. A MÁGICA: Calcula as Noites automaticamente
        function calcularNoites() {
            const checkInStr = document.querySelector('input[name="check_in"]').value;
            const checkOutStr = document.querySelector('input[name="check_out"]').value;

            if (checkInStr && checkOutStr) {
                // Corta a data BR (dd/mm/aaaa) em pedaços
                const partesIn = checkInStr.split('/');
                const partesOut = checkOutStr.split('/');

                // Garante que tem 3 partes (dia, mês, ano)
                if (partesIn.length === 3 && partesOut.length === 3) {
                    // Reorganiza para o formato que o JavaScript entende: yyyy-mm-dd
                    const dataIn = new Date(`${partesIn[2]}-${partesIn[1]}-${partesIn[0]}`);
                    const dataOut = new Date(`${partesOut[2]}-${partesOut[1]}-${partesOut[0]}`);

                    // Se as datas forem válidas e o Check-out for depois do Check-in
                    if (!isNaN(dataIn) && !isNaN(dataOut) && dataOut > dataIn) {
                        // Calcula a diferença em milissegundos e divide por 1 dia em milissegundos
                        const diferencaMs = Math.abs(dataOut - dataIn);
                        const totalNoites = Math.floor(diferencaMs / (1000 * 60 * 60 * 24));

                        // Joga o resultado no campo "Nights"
                        document.querySelector('input[name="nights"]').value = totalNoites;

                        // Dispara o cálculo do Total automaticamente!
                        calcularTotal();
                    }
                }
            }
        }

        // 3. Mágica do cálculo instantâneo do Total
        function calcularTotal() {
            let amount = parseFloat(document.querySelector('input[name="amount_per_night"]').value) || 0;
            let nights = parseFloat(document.querySelector('input[name="nights"]').value) || 0;
            let adults = parseFloat(document.querySelector('input[name="adults"]').value) || 0;

            let total = amount * nights * adults;
            document.getElementById('id_total').textContent = total.toFixed(2);
        }
    </script>
</body>

</html>
