<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<title>Novo Extra</title>
	<style>
		body {
			font-family: sans-serif;
			padding: 20px;
			background-color: #f4f4f4;
		}

		.container {
			max-width: 600px;
			margin: 0 auto;
			background: white;
			padding: 30px;
			border-radius: 8px;
			box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
		}

		h1 {
			text-align: center;
			color: #333;
		}

		div {
			margin-bottom: 15px;
		}

		label {
			font-weight: bold;
			display: block;
			margin-bottom: 5px;
		}

		input,
		select {
			width: 100%;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 4px;
			box-sizing: border-box;
		}

		.btn-salvar {
			width: 100%;
			padding: 12px;
			background-color: #17a2b8;
			color: white;
			border: none;
			border-radius: 4px;
			font-size: 16px;
			cursor: pointer;
			font-weight: bold;
		}

		.btn-voltar {
			display: block;
			text-align: center;
			text-decoration: none;
			color: #666;
			margin-top: 15px;
		}

		.config-box {
			background: #e9ecef;
			padding: 15px;
			border-radius: 8px;
			margin-bottom: 20px;
			font-size: 13px;
		}
	</style>
</head>

<body>
	<div class="container">
		<a href="{% url 'listar_extras' %}" class="btn-voltar">← Back</a>
		<h1>New Extra</h1>

		<!-- Área de Upload das Planilhas de Configuração -->
		<div class="config-box">
			<h3>⚙️ Configurar Listas (Upload de Excel)</h3>
			<form method="POST" action="{% url 'upload_config_extras' %}" enctype="multipart/form-data"
				style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
				{% csrf_token %}
				<div>
					<label>Excel de Produtos/Preços:</label>
					<input type="file" name="arquivo_produtos" accept=".xlsx" style="padding: 5px; font-size: 12px;">
				</div>
				<div>
					<label>Excel de Origens:</label>
					<input type="file" name="arquivo_origens" accept=".xlsx" style="padding: 5px; font-size: 12px;">
				</div>
				<button type="submit"
					style="grid-column: 1 / -1; background: #6c757d; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer;">Update list</button>
			</form>
		</div>

		<!-- Formulário de Cadastro -->
		<form method="POST" action="{% url 'novo_extra' %}">
			{% csrf_token %}
			<div><label>Date:</label> <input type="date" name="data" required></div>

			<div>
				<label>Product:</label>
				<select id="id_product" name="product" required>
					<option value="" disabled selected>Selecione...</option>
				</select>
			</div>

			<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
				<div><label>Amount:</label> <input type="number" step="1" id="id_amount" name="amount" required
						oninput="calcularTotal()"></div>
				<div><label>Unitary Value:</label> <input type="number" step="0.01" id="id_unitary" name="unitary_value"
						required readonly style="background-color: #f8f9fa;"></div>
			</div>

			<div><label>Total:</label> <input type="text" id="id_total" name="total" readonly
					style="background-color: #d4edda; font-weight: bold; color: green;"></div>

			<div>
				<label>Payment Method:</label>
				<select id="id_origin" name="origin" required>
					<option value="" disabled selected>Selecione...</option>
				</select>
			</div>

			<div>
				<label><b>Description:</b></label><br>
				<textarea name="description" rows="4" placeholder="Detalhes adicionais..."
					style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;"
					required></textarea>
			</div>


			<button type="submit" class="btn-salvar">Salve Extra</button>
		</form>
	</div>

	<!-- A MÁGICA DO JAVASCRIPT AQUI -->
	<script>
		// 1. Pega os dados do Python (que vieram do Excel)
		const produtosDoExcel = {{ produtos_json| safe }};
		const origensDoExcel = {{ origens_json| safe }};

		const selectProduct = document.getElementById('id_product');
		const selectOrigin = document.getElementById('id_origin');
		const inputUnitary = document.getElementById('id_unitary');
		const inputAmount = document.getElementById('id_amount');
		const inputTotal = document.getElementById('id_total');

		// 2. Preenche o Select de Produtos
		for (let [nome, preco] of Object.entries(produtosDoExcel)) {
			let option = document.createElement('option');
			option.value = nome;
			option.textContent = nome;
			option.dataset.preco = preco; // Esconde o preço dentro da opção
			selectProduct.appendChild(option);
		}

		// 3. Preenche o Select de Origens
		origensDoExcel.forEach(origem => {
			let option = document.createElement('option');
			option.value = origem;
			option.textContent = origem;
			selectOrigin.appendChild(option);
		});

		// 4. Quando troca o produto, joga o preço no campo e calcula
		selectProduct.addEventListener('change', function () {
			let opcaoSelecionada = this.options[this.selectedIndex];
			inputUnitary.value = opcaoSelecionada.dataset.preco;
			calcularTotal();
		});

		// 5. Função que multiplica Amount * Unitary Value
		function calcularTotal() {
			let amount = parseFloat(inputAmount.value) || 0;
			let unitary = parseFloat(inputUnitary.value) || 0;
			let total = amount * unitary;
			inputTotal.value = "R$ " + total.toFixed(2);
		}
	</script>
</body>

</html>
