<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Lançamento de Despesas</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        select,
        input[type="text"],
        input[type="date"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Lançar Nova Despesa</h1>

        <div style="text-align: right; margin-bottom: 20px;">
            <a href="{% url 'logout' %}"
                style="color: red; text-decoration: none; font-weight: bold; font-size: 14px;">🔒 Sair do Sistema</a>
        </div>

        <form method="POST" action="{% url 'criar_despesa' %}" style="display: grid; gap: 15px;">

            {% csrf_token %}

            <div>
                <label><b>Data:</b></label><br>
                <input type="date" name="data"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div>
                <label><b>Valor (R$):</b></label><br>
                <input type="number" step="0.01" name="valor" placeholder="Ex: 150.50"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div>
                <label><b>Origem:</b></label><br>
                <select name="origem" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"
                    required>
                    <option value="" disabled selected>Selecione a origem...</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="PIX">PIX</option>
                    <option value="Transferência">Transferência</option>
                </select>
            </div>

            <!-- CATEGORIA COM O ID ESPECIAL -->
            <div>
                <label><b>Categoria:</b></label><br>
                <select id="id_categoria" name="categoria"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
                    <option value="" disabled selected>Selecione a categoria...</option>
                    <option value="Annualidad-Fixa">Annualidad-Fixa</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Educação">Educação</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <!-- SUBCATEGORIA COM O ID ESPECIAL -->
            <div>
                <label><b>Subcategoria:</b></label><br>
                <select id="id_subcategoria" name="subcategoria"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
                    <option value="" disabled selected>Selecione a categoria primeiro...</option>
                </select>
            </div>

            <div>
                <label><b>Número:</b></label><br>
                <input type="text" name="numero" placeholder="Nº da nota ou documento"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div>
                <label><b>Info Extras:</b></label><br>
                <input type="text" name="info"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div>
                <label><b>Descrição:</b></label><br>
                <textarea name="descricao" rows="4" placeholder="Detalhes adicionais..."
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;"
                    required></textarea>
            </div>

            <button type="submit"
                style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;">
                Salvar Lançamento
            </button>

            <a href="{% url 'home' %}"
                style="display: block; text-align: center; text-decoration: none; color: #666; margin-top: 10px;">←
                Voltar para a lista</a>

        </form>
    </div>



    <button type="submit"
        style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;">
        Salvar Lançamento
    </button>

    <!-- Botão para voltar -->
    <a href="{% url 'home' %}"
        style="display: block; text-align: center; text-decoration: none; color: #666; margin-top: 10px;">←
        Voltar para a lista</a>

    </form>
    </div>
